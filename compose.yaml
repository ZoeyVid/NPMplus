services:
  npmplus:
    container_name: npmplus
    image: ghcr.io/ktncode/npmplus:latest
    restart: always
    network_mode: host
    volumes:
      - "/opt/npmplus:/data"
      - "/var/www:/var/www" # optional, if you want to use NPMplus directly as webserver for html/php
    environment:
      # Basic Configuration
      - "TZ=Asia/Tokyo" # set timezone, required
      
      # ACME Configuration (Legacy - will be replaced by ACME Servers in GUI)
      # These environment variables are deprecated and will be removed in future versions
      # Please use the ACME Servers management in the web interface instead
      # - "ACME_EMAIL=your-email" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_EAB_KID=123456789abcdef" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_EAB_HMAC_KEY=123456789abcdef" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_MUST_STAPLE=true" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_OCSP_STAPLING=true" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_PROFILE=shortlived" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_KEY_TYPE=ecdsa" # DEPRECATED: Use ACME Servers in GUI
      # - "ACME_SERVER_TLS_VERIFY=true" # DEPRECATED: Use ACME Servers in GUI
      
      # SSL Configuration
      - "CUSTOM_OCSP_STAPLING=true" # enables ocsp stapling for custom certs
      
      # User/Group Configuration
      - "PUID=1000" # set group id, needs to be a number greater or equal to 99, or equal to 0, default 0 (root)
      - "PGID=1000" # set user id, needs to be a number greater or equal to 99, or equal to 0, default 0 (root), requires PUID to be not 0
      
      # Port Configuration
      - "NPM_PORT=81" # Port the NPM UI should be bound to, default 81
      - "HTTP_PORT=80" # tcp port to use for http traffic, default 80
      - "HTTPS_PORT=443" # udp and tcp port to use for https traffic, default 443
      
      # Network Binding (optional)
      # - "IPV4_BINDING=127.0.0.1" # IPv4 address to bind, defaults to all
      # - "IPV6_BINDING=[::1]" # IPv6 address to bind, defaults to all
      # - "DISABLE_IPV6=true" # fully disables listing on IPv6 and the IPv6 resolver of nginx
      # - "NPM_LISTEN_LOCALHOST=true" # Binds the NPM UI only to localhost
      
      # Security and Performance
      - "NGINX_HSTS_SUBDOMAINS=true" # when enabling security headers, also enable hsts for subdomains
      - "X_FRAME_OPTIONS=sameorigin" # value to use for the X-Frame-Options header when enabling security headers
      
      # Logging and Monitoring
      - "LOGROTATE=true" # Enables writing http access logs and enables daily logrotation
      - "LOGROTATIONS=7" # Set how many rotations to keep
      
      # Maintenance
      - "CRT=24" # Set how many hours should be between certbot trying to renew your certs
      - "FULLCLEAN=false" # Clean unused config folders
      
      # Initial Setup (remove after first setup)
      - "INITIAL_ADMIN_EMAIL=admin@example.com" # email to use for the initial user
      - "INITIAL_ADMIN_PASSWORD=changeme123" # password to use for the initial user - CHANGE THIS!
      
      # Advanced Options (uncomment if needed)
      # - "DEFAULT_CERT_ID=1" # ID of cert to use instead of dummycerts
      # - "DISABLE_HTTP=true" # disables nginx to listen on port 80
      # - "DISABLE_H3_QUIC=true" # disables HTTP/3 and QUIC
      # - "NGINX_404_REDIRECT=true" # Redirect to / instead of showing a 404 error page
      # - "NGINX_DISABLE_PROXY_BUFFERING=true" # Disables proxy buffering
      # - "NGINX_WORKER_PROCESSES=auto" # value of worker_processes
      # - "NGINX_WORKER_CONNECTIONS=1024" # value of worker_connections
      
      # GoAccess Analytics (uncomment to enable)
      # - "GOA=true" # Enables goaccess analytics
      # - "GOA_PORT=91" # Port for goaccess
      
      # PHP Support (uncomment if needed)
      # - "PHP84=true" # Activate PHP84
      # - "PHP84_APKS=php84-curl php84-openssl" # Add php extensions

