# --------------------------------------------------------------------------
# {{ incoming_port }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# --------------------------------------------------------------------------

  {% assign first_upstream_server = npmplus_upstream_servers | first %}
  {% assign upstream_host_prefix = first_upstream_server.host | slice: 0, 3 %}

  {% if first_upstream_server.port != "$server_port" and upstream_host_prefix != "cu_" %}
    upstream stream_upstream_{{ id }} {
      zone stream_upstream_{{ id }} 128k;
      {% case npmplus_load_balance_method %}
        {% when "least_conn" %}least_conn;
        {% when "hash" %}hash $remote_addr;
        {% when "hash_consistent" %}hash $remote_addr consistent;
        {% when "least_time_connect" %}least_time connect;
        {% when "least_time_first_byte" %}least_time first_byte;
        {% when "least_time_last_byte" %}least_time last_byte;
        {% when "least_time_last_byte_inflight" %}least_time last_byte inflight;
        {% when "random" %}random;
        {% when "random_two_least_connections" %}random two least_conn;
        {% when "random_two_least_time_connect" %}random two least_time=connect;
        {% when "random_two_least_time_first_byte" %}random two least_time=first_byte;
        {% when "random_two_least_time_last_byte" %}random two least_time=last_byte;
      {% endcase %}
      {% include "_upstream_servers.conf" %}
    }
  {% endif %}

  {% if tcp_forwarding == true %}
    server {
      listen {{ env.IPV4_BINDING }}:{{ incoming_port }}{% if certificate %} ssl{% endif %} reuseport deferred{% if env.ENABLE_MPTCP == "true" %} multipath{% endif %} so_keepalive=on;
      {% if env.DISABLE_IPV6 == "false" %}listen {{ env.IPV6_BINDING }}:{{ incoming_port }}{% if certificate %} ssl{% endif %} reuseport deferred{% if env.ENABLE_MPTCP == "true" %} multipath{% endif %} so_keepalive=on;{% endif %}

      {% if npmplus_proxy_protocol_forwarding == 1 %}proxy_protocol on;{% elsif npmplus_proxy_protocol_forwarding == 2 %}proxy_protocol v2;{% endif %}
      {% if npmplus_proxy_tls == true %}proxy_ssl on;{% endif %}


      {% if certificate %}
        {% if certificate.provider == "letsencrypt" %}
          # Certbot TLS
          ssl_certificate /data/tls/certbot/live/npm-{{ certificate_id }}/fullchain.pem;
          ssl_certificate_key /data/tls/certbot/live/npm-{{ certificate_id }}/privkey.pem;
          {% if env.ACME_OCSP_STAPLING == "true" %}
            ssl_stapling on;
            ssl_stapling_verify on;
            ssl_stapling_file /data/tls/certbot/live/npm-{{ certificate_id }}.der;
            ssl_certificate_compression off;
          {% endif %}
        {% else %}
          # Custom TLS
          ssl_certificate /data/tls/custom/npm-{{ certificate_id }}/fullchain.pem;
          ssl_certificate_key /data/tls/custom/npm-{{ certificate_id }}/privkey.pem;
          {% if env.CUSTOM_OCSP_STAPLING == "true" %}
            ssl_stapling on;
            ssl_stapling_verify on;
            ssl_stapling_file /data/tls/custom/npm-{{ certificate_id }}.der;
            ssl_certificate_compression off;
          {% endif %}
        {% endif %}

        {% if npmplus_mtls_certificate_id > 0 %}
          ssl_verify_client {% if npmplus_mtls_verify_client_optional == true %}optional{% else %}on{% endif %};
          ssl_client_certificate /data/tls/mtls/npm-{{ npmplus_mtls_certificate_id }}.pem;
        {% endif %}
      {% endif %}

      {% if first_upstream_server.port == "$server_port" %}
        proxy_pass {{ first_upstream_server.host }}:$server_port;
      {% elsif upstream_host_prefix == "cu_" %}
        proxy_pass {{ first_upstream_server.host }};
      {% else %}
        proxy_pass stream_upstream_{{ id }};
      {% endif %}

      {{ npmplus_advanced_config }}

      # Custom
      include /data/custom_nginx/server_stream.conf;
      include /data/custom_nginx/server_stream_tcp.conf;
    }
  {% endif %}

  {% if udp_forwarding == true %}
    server {
      listen {{ env.IPV4_BINDING }}:{{ incoming_port }} udp reuseport;
      {% if env.DISABLE_IPV6 == "false" %}listen {{ env.IPV6_BINDING }}:{{ incoming_port }} udp reuseport;{% endif %}

      {% if npmplus_proxy_protocol_forwarding == 2 %}proxy_protocol v2;{% endif %}

      {% if first_upstream_server.port == "$server_port" %}
        proxy_pass {{ first_upstream_server.host }}:$server_port;
      {% elsif upstream_host_prefix == "cu_" %}
        proxy_pass {{ first_upstream_server.host }};
      {% else %}
        proxy_pass stream_upstream_{{ id }};
      {% endif %}

      {{ npmplus_advanced_config }}

      # Custom
      include /data/custom_nginx/server_stream.conf;
      include /data/custom_nginx/server_stream_udp.conf;
    }
  {% endif %}
