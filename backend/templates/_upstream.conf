upstream {{ forward_upstream_name }} {
  zone {{ forward_upstream_name }} 128k;
  {% case npmplus_load_balance_method %}
    {% when "least_conn" %}  least_conn;
    {% when "ip_hash" %}  ip_hash;
    {% when "least_time_header" %}  least_time header;
    {% when "least_time_last_byte" %}  least_time last_byte;
    {% when "least_time_last_byte_inflight" %}  least_time last_byte inflight;
    {% when "random" %}  random;
    {% when "random_two_least_connections" %}  random two least_conn;
    {% when "random_two_least_time_header" %}  random two least_time=header;
    {% when "random_two_least_time_last_byte" %}  random two least_time=last_byte;
  {% endcase %}
  {% include "_upstream_servers.conf" %}
}
