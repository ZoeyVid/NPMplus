upstream {{ forward_upstream_name }} {
  zone {{ forward_upstream_name }} 128k;
  {% case npmplus_load_balance_method %}
    {% when "least_conn" %}  least_conn;
    {% when "ip_hash" %}  ip_hash;
    {% when "least_time_header" %}  least_time header;
    {% when "least_time_last_byte" %}  least_time last_byte;
    {% when "least_time_last_byte_inflight" %}  least_time last_byte inflight;
    {% when "random" %}  random;
    {% when "random_two_least_connections" %}  random two least_conn;
    {% when "random_two_least_time_header" %}  random two least_time=header;
    {% when "random_two_least_time_last_byte" %}  random two least_time=last_byte;
  {% endcase %}
  {% for server in npmplus_upstream_servers %}
    {% assign server_host_prefix = server.host | slice: 0, 3 %}
    {% if server_host_prefix != "cu_" %}
      server {{ server.host }}{% if server.port != nil %}:{{ server.port }}{% endif %} resolve{% if server.weight > 1 %} weight={{ server.weight }}{% endif %}{% if server.max_conns != nil %} max_conns={{ server.max_conns }}{% endif %}{% if server.max_fails != nil %} max_fails={{ server.max_fails }}{% endif %}{% if server.fail_timeout != nil %} fail_timeout={{ server.fail_timeout }}{% endif %}{% if server.backup %} backup{% endif %}{% if server.down %} down{% endif %};
    {% endif %}
  {% endfor %}
}
