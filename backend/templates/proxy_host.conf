# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------
{% assign forward_host_last_char = forward_host | slice: -1 -%}

{% if enabled %}
  server {
    set $forward_scheme "{{ forward_scheme }}";
    set $server         "{{ forward_host }}";
    set $port           "{{ forward_port }}";
    set $forward_path   "{{ forward_path }}";
    {% if crowdsec_enabled and crowdsec_disabled_for_host %}
    set $crowdsec_disabled "1";
    {% else %}
    set $crowdsec_disabled "0";
    {% endif %}

    {% if enable_logs %}
      # Domain-specific logging
      access_log /data/logs/proxy-host-{{ id }}/access.log detailed;
      error_log /data/logs/proxy-host-{{ id }}/error.log;
    {% else %}
      access_log off;
      error_log off;
    {% endif %}

    {% include "_common.conf" %}

    {% if access_list_id > 0 %}
      {% if access_list.items.length > 0 %}
        # Authorization
        auth_basic            "Authorization required";
        auth_basic_user_file  /data/access/{{ access_list_id }};
        {% if access_list.pass_auth %}
          proxy_set_header Authorization "";
        {% endif %}
      {% endif %}
      # Access Rules: {{ access_list.clients | size }} total
      {% for client in access_list.clients %}
        {{ client | nginxAccessRule }}
      {% endfor %}
      deny all;
      # Access checks must...
      {% if access_list.satisfy_any %}
        satisfy any;
      {% else %}
        satisfy all;
      {% endif %}
    {% endif %}

    {% if use_default_page %}
      # Use Default Site configuration instead of proxy
      {% if default_site_setting.value == "444" %}
        return 444;
      {% elsif default_site_setting.value == "404" %}
        return 404;
      {% elsif default_site_setting.value == "redirect" and default_site_setting.meta.redirect %}
        return 301 {{ default_site_setting.meta.redirect }};
      {% elsif default_site_setting.value == "html" and default_site_setting.meta.html %}
        location / {
          return 200 '{{ default_site_setting.meta.html | escape }}';
          add_header Content-Type "text/html; charset=utf-8";
        }
      {% elsif default_site_setting.value == "congratulations" %}
        location / {
          root /html/default;
          try_files $uri /index.html;
        }
      {% else %}
        return 404;
      {% endif %}
    {% elsif use_default_location %}
      location / {

        {% if forward_scheme == "http" or forward_scheme == "https" %}

          include proxy-headers.conf;
          {% if allow_websocket_upgrade == false %}proxy_set_header Accept-Encoding "";{% endif %}
          proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};

        {% elsif forward_scheme == "grpc" or forward_scheme == "grpcs" %}

          include grpc-headers.conf;
          {% if allow_websocket_upgrade == false %}grpc_set_header Accept-Encoding "";{% endif %}
          grpc_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};

        {% elsif forward_scheme == "path" %}

          {% if forward_host_last_char == "/" %}
            alias {{ forward_host }};
          {% else %}
            root {{ forward_host }};
          {% endif %}

          {% if allow_websocket_upgrade == true %}fancyindex on;{% endif %}

          {% if forward_path != null %}
            location ~* \.php(?:$|/) {
              fastcgi_split_path_info ^(.*\.php)(/.*)$;
              try_files $fastcgi_script_name =404;
              fastcgi_pass unix:/run/php{{ forward_port }}.sock;
            }
          {% endif %}

        {% endif %}
      }
    {% endif %}

    # custom locations
    {{ locations }}

    {{ advanced_config }}

    # Custom
    include /data/custom_nginx/server_proxy.conf;
  }
{% endif %}
