# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------
{% assign forward_host_last_char = forward_host | slice: -1 -%}
{% assign has_host_auth_items = access_list and access_list.items and access_list.items.size > 0 %}
{% assign has_host_access_rules = access_list and access_list.clients and access_list.clients.size > 0 %}

{% if enabled %}
  {{ upstreams }}

  {% assign auth_request_anubis_upstream_host = env.AUTH_REQUEST_ANUBIS_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_ANUBIS_UPSTREAM contains "https://" %}{% assign auth_request_anubis_upstream_scheme = "https://" %}{% else %}{% assign auth_request_anubis_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_anubis_upstream_host contains "]:" %}
    {% assign auth_request_anubis_upstream_sni_name = auth_request_anubis_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_anubis_upstream_sni_name = auth_request_anubis_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_anubis_upstream_port = auth_request_anubis_upstream_host | split: ":" | last %}
  {% assign auth_request_anubis_upstream_host_header = auth_request_anubis_upstream_sni_name %}
  {% if auth_request_anubis_upstream_scheme == "http://" and auth_request_anubis_upstream_port != "80" %}
    {% assign auth_request_anubis_upstream_host_header = auth_request_anubis_upstream_host %}
  {% elsif auth_request_anubis_upstream_scheme == "https://" and auth_request_anubis_upstream_port != "443" %}
    {% assign auth_request_anubis_upstream_host_header = auth_request_anubis_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "anubis" or create_anubis_locations %}
    upstream auth_request_anubis_{{ id }} {
      zone auth_request_anubis_{{ id }} 128k;
      server {{ auth_request_anubis_upstream_host }} resolve;
    }
  {% endif %}

  {% assign auth_request_tinyauth_upstream_host = env.AUTH_REQUEST_TINYAUTH_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_TINYAUTH_UPSTREAM contains "https://" %}{% assign auth_request_tinyauth_upstream_scheme = "https://" %}{% else %}{% assign auth_request_tinyauth_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_tinyauth_upstream_host contains "]:" %}
    {% assign auth_request_tinyauth_upstream_sni_name = auth_request_tinyauth_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_tinyauth_upstream_sni_name = auth_request_tinyauth_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_tinyauth_upstream_port = auth_request_tinyauth_upstream_host | split: ":" | last %}
  {% assign auth_request_tinyauth_upstream_host_header = auth_request_tinyauth_upstream_sni_name %}
  {% if auth_request_tinyauth_upstream_scheme == "http://" and auth_request_tinyauth_upstream_port != "80" %}
    {% assign auth_request_tinyauth_upstream_host_header = auth_request_tinyauth_upstream_host %}
  {% elsif auth_request_tinyauth_upstream_scheme == "https://" and auth_request_tinyauth_upstream_port != "443" %}
    {% assign auth_request_tinyauth_upstream_host_header = auth_request_tinyauth_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "tinyauth" or create_tinyauth_locations %}
    upstream auth_request_tinyauth_{{ id }} {
      zone auth_request_tinyauth_{{ id }} 128k;
      server {{ auth_request_tinyauth_upstream_host }} resolve;
    }
  {% endif %}

  {% assign auth_request_oauth2proxy_upstream_host = env.AUTH_REQUEST_OAUTH2PROXY_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_OAUTH2PROXY_UPSTREAM contains "https://" %}{% assign auth_request_oauth2proxy_upstream_scheme = "https://" %}{% else %}{% assign auth_request_oauth2proxy_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_oauth2proxy_upstream_host contains "]:" %}
    {% assign auth_request_oauth2proxy_upstream_sni_name = auth_request_oauth2proxy_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_oauth2proxy_upstream_sni_name = auth_request_oauth2proxy_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_oauth2proxy_upstream_port = auth_request_oauth2proxy_upstream_host | split: ":" | last %}
  {% assign auth_request_oauth2proxy_upstream_host_header = auth_request_oauth2proxy_upstream_sni_name %}
  {% if auth_request_oauth2proxy_upstream_scheme == "http://" and auth_request_oauth2proxy_upstream_port != "80" %}
    {% assign auth_request_oauth2proxy_upstream_host_header = auth_request_oauth2proxy_upstream_host %}
  {% elsif auth_request_oauth2proxy_upstream_scheme == "https://" and auth_request_oauth2proxy_upstream_port != "443" %}
    {% assign auth_request_oauth2proxy_upstream_host_header = auth_request_oauth2proxy_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "oauth2proxy" or create_oauth2proxy_locations %}
    upstream auth_request_oauth2proxy_{{ id }} {
      zone auth_request_oauth2proxy_{{ id }} 128k;
      server {{ auth_request_oauth2proxy_upstream_host }} resolve;
    }
  {% endif %}

  {% assign auth_request_voidauth_upstream_host = env.AUTH_REQUEST_VOIDAUTH_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_VOIDAUTH_UPSTREAM contains "https://" %}{% assign auth_request_voidauth_upstream_scheme = "https://" %}{% else %}{% assign auth_request_voidauth_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_voidauth_upstream_host contains "]:" %}
    {% assign auth_request_voidauth_upstream_sni_name = auth_request_voidauth_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_voidauth_upstream_sni_name = auth_request_voidauth_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_voidauth_upstream_port = auth_request_voidauth_upstream_host | split: ":" | last %}
  {% assign auth_request_voidauth_upstream_host_header = auth_request_voidauth_upstream_sni_name %}
  {% if auth_request_voidauth_upstream_scheme == "http://" and auth_request_voidauth_upstream_port != "80" %}
    {% assign auth_request_voidauth_upstream_host_header = auth_request_voidauth_upstream_host %}
  {% elsif auth_request_voidauth_upstream_scheme == "https://" and auth_request_voidauth_upstream_port != "443" %}
    {% assign auth_request_voidauth_upstream_host_header = auth_request_voidauth_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "voidauth" or create_voidauth_locations %}
    upstream auth_request_voidauth_{{ id }} {
      zone auth_request_voidauth_{{ id }} 128k;
      server {{ auth_request_voidauth_upstream_host }} resolve;
    }
  {% endif %}

  {% assign auth_request_authelia_upstream_host = env.AUTH_REQUEST_AUTHELIA_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_AUTHELIA_UPSTREAM contains "https://" %}{% assign auth_request_authelia_upstream_scheme = "https://" %}{% else %}{% assign auth_request_authelia_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_authelia_upstream_host contains "]:" %}
    {% assign auth_request_authelia_upstream_sni_name = auth_request_authelia_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_authelia_upstream_sni_name = auth_request_authelia_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_authelia_upstream_port = auth_request_authelia_upstream_host | split: ":" | last %}
  {% assign auth_request_authelia_upstream_host_header = auth_request_authelia_upstream_sni_name %}
  {% if auth_request_authelia_upstream_scheme == "http://" and auth_request_authelia_upstream_port != "80" %}
    {% assign auth_request_authelia_upstream_host_header = auth_request_authelia_upstream_host %}
  {% elsif auth_request_authelia_upstream_scheme == "https://" and auth_request_authelia_upstream_port != "443" %}
    {% assign auth_request_authelia_upstream_host_header = auth_request_authelia_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "authelia" or create_authelia_locations %}
    upstream auth_request_authelia_{{ id }} {
      zone auth_request_authelia_{{ id }} 128k;
      server {{ auth_request_authelia_upstream_host }} resolve;
    }
  {% endif %}

  {% assign auth_request_authentik_upstream_host = env.AUTH_REQUEST_AUTHENTIK_UPSTREAM | replace: "https://", "" | replace: "http://", "" %}
  {% if env.AUTH_REQUEST_AUTHENTIK_UPSTREAM contains "https://" %}{% assign auth_request_authentik_upstream_scheme = "https://" %}{% else %}{% assign auth_request_authentik_upstream_scheme = "http://" %}{% endif %}
  {% if auth_request_authentik_upstream_host contains "]:" %}
    {% assign auth_request_authentik_upstream_sni_name = auth_request_authentik_upstream_host | split: "]:" | first | append: "]" %}
  {% else %}
    {% assign auth_request_authentik_upstream_sni_name = auth_request_authentik_upstream_host | split: ":" | first %}
  {% endif %}
  {% assign auth_request_authentik_upstream_port = auth_request_authentik_upstream_host | split: ":" | last %}
  {% assign auth_request_authentik_upstream_host_header = auth_request_authentik_upstream_sni_name %}
  {% if auth_request_authentik_upstream_scheme == "http://" and auth_request_authentik_upstream_port != "80" %}
    {% assign auth_request_authentik_upstream_host_header = auth_request_authentik_upstream_host %}
  {% elsif auth_request_authentik_upstream_scheme == "https://" and auth_request_authentik_upstream_port != "443" %}
    {% assign auth_request_authentik_upstream_host_header = auth_request_authentik_upstream_host %}
  {% endif %}

  {% if npmplus_auth_request == "authentik" or npmplus_auth_request == "authentik-send-basic-auth" or create_authentik_locations %}
    upstream auth_request_authentik_{{ id }} {
      zone auth_request_authentik_{{ id }} 128k;
      server {{ auth_request_authentik_upstream_host }} resolve;
    }
  {% endif %}

  server {
    {% include "_common.conf" %}

    location / {

      {% if has_host_auth_items and filename %}
        # Authorization
        auth_basic            "basic access authentication required";
        auth_basic_user_file  {{ filename }};
        {% if access_list.pass_auth %}
          proxy_set_header Authorization "";
        {% endif %}
      {% endif %}
      {% if has_host_access_rules %}
        # Access Rules: {{ access_list.clients | size }} total
        {% for client in access_list.clients %}
          {{ client | nginxAccessRule }}
        {% endfor %}
        deny all;
        # Access checks must...
        {% if access_list.satisfy_any %}
          satisfy any;
        {% else %}
          satisfy all;
        {% endif %}
      {% endif %}

      {% if npmplus_noindex == true %}include noindex-nofollow.conf;{% endif %}
      {% if npmplus_crowdsec_appsec == true %}set $crowdsec_disable_appsec 1;{% endif %}

      {% if npmplus_x_frame_options == "upstream" %}
      {% elsif npmplus_x_frame_options == "none" %}
         more_clear_headers "X-Frame-Options";
      {% elsif npmplus_x_frame_options == "DENY" %}
         more_set_headers "X-Frame-Options: DENY";
      {% else %}
         more_set_headers "X-Frame-Options: SAMEORIGIN";
      {% endif %}

      {% if forward_scheme == "http" or forward_scheme == "https" %}

        include proxy-headers.conf;
        {% if npmplus_upstream_compression != true %}proxy_set_header Accept-Encoding "";{% endif %}
        {% if npmplus_proxy_request_buffering == true and npmplus_crowdsec_appsec == true %}proxy_request_buffering off;{% endif %}
        {% if npmplus_proxy_response_buffering == true %}proxy_buffering off;{% endif %}
        proxy_pass {{ forward_scheme }}://{{ forward_upstream_name }}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};

      {% elsif forward_scheme == "grpc" or forward_scheme == "grpcs" %}

        include grpc-headers.conf;
        {% if npmplus_upstream_compression != true %}grpc_set_header Accept-Encoding "";{% endif %}
        grpc_pass {{ forward_scheme }}://{{ forward_upstream_name }}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};

      {% elsif forward_scheme == "path" %}

        {% if forward_host_last_char == "/" %}
          alias {{ forward_host }};
        {% else %}
          root {{ forward_host }};
        {% endif %}

        {% if npmplus_fancyindex == true %}fancyindex on;{% endif %}

        {% if forward_port != null %}
          location ~* [^/]\.php(?:$|/) {
            fastcgi_split_path_info ^(.*\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            fastcgi_pass unix:/run/php{{ forward_port }}.sock;
          }
        {% endif %}

      {% endif %}

      {% if npmplus_auth_request == "anubis" %}
        auth_request /.within.website/x/cmd/anubis/api/check;
        error_page 401 403 =200 /.within.website?redir=$request_uri;
      {% endif %}

      {% if npmplus_auth_request == "tinyauth" %}
        auth_request /tinyauth;
        auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $redirection_url;

        auth_request_set $tinyauth_remote_user $upstream_http_remote_user;
        auth_request_set $tinyauth_remote_email $upstream_http_remote_email;
        auth_request_set $tinyauth_remote_name $upstream_http_remote_name;
        auth_request_set $tinyauth_remote_groups $upstream_http_remote_groups;
        proxy_set_header Remote-User $tinyauth_remote_user;
        proxy_set_header Remote-Email $tinyauth_remote_email;
        proxy_set_header Remote-Name $tinyauth_remote_name;
        proxy_set_header Remote-Groups $tinyauth_remote_groups;
      {% endif %}

      {% if npmplus_auth_request == "oauth2proxy" %}
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        auth_request_set $user $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header X-User $user;
        proxy_set_header X-Email $email;

        auth_request_set $token $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Access-Token $token;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        auth_request_set $auth_cookie_name_upstream_1 $upstream_cookie_auth_cookie_name_1;
        if ($auth_cookie ~* "(; .*)") {
            set $auth_cookie_name_0 $auth_cookie;
            set $auth_cookie_name_1 "auth_cookie_name_1=$auth_cookie_name_upstream_1$1";
        }
        if ($auth_cookie_name_upstream_1) {
            add_header Set-Cookie $auth_cookie_name_0;
            add_header Set-Cookie $auth_cookie_name_1;
        }
      {% endif %}

      {% if npmplus_auth_request == "voidauth" %}
        auth_request /api/authz/auth-request;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;
        error_page 407 =302 $redirection_url;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;
      {% endif %}

      {% if npmplus_auth_request == "authelia" %}
        auth_request /internal/authelia/authz;
        auth_request_set $redirection_url $upstream_http_location;
        error_page 401 =302 $redirection_url;

        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email $email;
        proxy_set_header Remote-Name $name;
      {% endif %}

      {% if npmplus_auth_request == "authentik" or npmplus_auth_request == "authentik-send-basic-auth" %}
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
        auth_request_set $authentik_entitlements $upstream_http_x_authentik_entitlements;
        auth_request_set $authentik_email $upstream_http_x_authentik_email;
        auth_request_set $authentik_name $upstream_http_x_authentik_name;
        auth_request_set $authentik_uid $upstream_http_x_authentik_uid;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups $authentik_groups;
        proxy_set_header X-authentik-entitlements $authentik_entitlements;
        proxy_set_header X-authentik-email $authentik_email;
        proxy_set_header X-authentik-name $authentik_name;
        proxy_set_header X-authentik-uid $authentik_uid;

        {% if npmplus_auth_request == "authentik-send-basic-auth" %}
          auth_request_set $authentik_auth $upstream_http_authorization;
          proxy_set_header Authorization $authentik_auth;
        {% endif %}
      {% endif %}

      {% if npmplus_auth_request == "lua-oidc" %}
        access_by_lua_block {
          local cjson         = require("cjson")
          local session_store = ngx.shared.oidc_sessions

          local function uri_escape(s)
            return (s:gsub("([^%w%-%.%_%~])", function(c)
              return string.format("%%%02X", string.byte(c))
            end))
          end

          local cookie_name = "npmplus_oidc_{{ id }}"
          local raw_cookie  = ngx.var["cookie_" .. cookie_name]

          if raw_cookie then
            local session_data = session_store:get(raw_cookie)
            if session_data then
              local ok, claims = pcall(cjson.decode, session_data)
              if ok and claims then
                ngx.req.set_header("Remote-User",  claims.sub   or "")
                ngx.req.set_header("Remote-Email", claims.email or "")
                ngx.req.set_header("Remote-Name",  claims.name  or "")
                return
              end
            end
          end

          local rd = uri_escape(ngx.var.scheme .. "://" .. ngx.var.host .. ngx.var.request_uri)
          ngx.redirect("/npmplus-oidc-{{ id }}/login?rd=" .. rd)
        }
      {% endif %}

      {{ npmplus_location_config }}
    }

    {% if npmplus_auth_request == "anubis" or create_anubis_locations %}
      location /.within.website {
        proxy_ssl_name {{ auth_request_anubis_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_anubis_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_anubis_upstream_scheme }}auth_request_anubis_{{ id }};
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
      }
      {% if env.AUTH_REQUEST_ANUBIS_USE_CUSTOM_IMAGES == "true" %}
        location /.within.website/x/cmd/anubis/static/img {
          alias /data/anubis/;
        }
      {% endif %}
    {% endif %}

    {% if npmplus_auth_request == "tinyauth" or create_tinyauth_locations %}
      location /tinyauth {
        proxy_ssl_name {{ auth_request_tinyauth_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_tinyauth_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_tinyauth_upstream_scheme }}auth_request_tinyauth_{{ id }}/api/auth/nginx;
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-URI $request_uri;
      }
    {% endif %}

    {% if npmplus_auth_request == "oauth2proxy" or create_oauth2proxy_locations %}
      location /oauth2 {
        proxy_ssl_name {{ auth_request_oauth2proxy_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_oauth2proxy_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_oauth2proxy_upstream_scheme }}auth_request_oauth2proxy_{{ id }};
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$is_request_port$request_port$request_uri;
      }
      location /oauth2/auth {
        proxy_ssl_name {{ auth_request_oauth2proxy_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_oauth2proxy_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_oauth2proxy_upstream_scheme }}auth_request_oauth2proxy_{{ id }};
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Uri $request_uri;
      }
      location @oauth2_signin {
        internal;
        return 302 /oauth2/sign_in?rd=$scheme://$host$is_request_port$request_port$request_uri;
      }
    {% endif %}

    {% if npmplus_auth_request == "voidauth" or create_voidauth_locations %}
      location /api/authz/auth-request {
        proxy_ssl_name {{ auth_request_voidauth_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_voidauth_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_voidauth_upstream_scheme }}auth_request_voidauth_{{ id }}/api/authz/auth-request;
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Original-URL $scheme://$host$is_request_port$request_port$request_uri;
      }
    {% endif %}

    {% if npmplus_auth_request == "authelia" or create_authelia_locations %}
      location /internal/authelia/authz {
        proxy_ssl_name {{ auth_request_authelia_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_authelia_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_authelia_upstream_scheme }}auth_request_authelia_{{ id }}/api/authz/auth-request;
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$host$is_request_port$request_port$request_uri;
      }
    {% endif %}

    {% if npmplus_auth_request == "authentik" or npmplus_auth_request == "authentik-send-basic-auth" or create_authentik_locations %}
      location /outpost.goauthentik.io {
        proxy_ssl_name {{ auth_request_authentik_upstream_sni_name }};
        proxy_set_header Host {{ auth_request_authentik_upstream_host_header }};
        include auth-request-headers.conf;
        proxy_set_header Accept-Encoding "";
        proxy_pass {{ auth_request_authentik_upstream_scheme }}auth_request_authentik_{{ id }}/outpost.goauthentik.io;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$is_request_port$request_port$request_uri;
      }
      location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$host$is_request_port$request_port$request_uri;
      }
    {% endif %}

    {% if npmplus_auth_request == "lua-oidc" %}
      # --- NPMplus Lua OIDC: login initiator ---
      location /npmplus-oidc-{{ id }}/login {
        internal;
        content_by_lua_block {
          local cjson  = require("cjson")
          local http   = require("resty.http")
          local b64    = require("ngx.base64")

          -- Fetch OIDC discovery doc (cached in shared dict)
          local discovery_cache = ngx.shared.discovery
          local issuer          = "{{ env.OIDC_ISSUER_URL }}"
          local client_id       = "{{ env.OIDC_CLIENT_ID }}"
          local client_secret   = "{{ env.OIDC_CLIENT_SECRET }}"
          local redirect_uri    = ngx.var.scheme .. "://" .. ngx.var.host .. "/npmplus-oidc-{{ id }}/callback"

          local disc_doc
          local cached = discovery_cache:get(issuer)
          if cached then
            disc_doc = cjson.decode(cached)
          else
            local httpc = http.new()
            local res, err = httpc:request_uri(issuer .. "/.well-known/openid-configuration", { method = "GET", ssl_verify = true })
            if not res or res.status ~= 200 then
              ngx.status = 502
              ngx.say("OIDC discovery failed: " .. (err or res and res.status or "unknown"))
              return
            end
            disc_doc = cjson.decode(res.body)
            discovery_cache:set(issuer, res.body, 3600)
          end

          -- Build state + nonce, store in shared dict keyed by state for 10 min
          local state = ngx.encode_base64(ngx.hmac_sha1(client_secret, tostring(ngx.now()) .. ngx.var.remote_addr)):gsub("[^%w]",""):sub(1,32)
          local nonce = ngx.encode_base64(ngx.hmac_sha1(client_secret, state)):gsub("[^%w]",""):sub(1,24)
          local rd    = ngx.var.arg_rd or "/"
          ngx.shared.oidc_sessions:set("state:" .. state, cjson.encode({ nonce = nonce, rd = rd }), 600)

          local function uri_encode(s)
            return (s:gsub("([^%w%-%.%_%~])", function(c)
              return string.format("%%%02X", string.byte(c))
            end))
          end

          local auth_url = disc_doc.authorization_endpoint
            .. "?response_type=code"
            .. "&client_id="     .. uri_encode(client_id)
            .. "&redirect_uri="  .. uri_encode(redirect_uri)
            .. "&scope=openid+email+profile"
            .. "&state="         .. state
            .. "&nonce="         .. nonce

          ngx.redirect(auth_url)
        }
      }

      # --- NPMplus Lua OIDC: callback handler ---
      location /npmplus-oidc-{{ id }}/callback {
        content_by_lua_block {
          local cjson  = require("cjson")
          local http   = require("resty.http")

          local issuer       = "{{ env.OIDC_ISSUER_URL }}"
          local client_id    = "{{ env.OIDC_CLIENT_ID }}"
          local client_secret = "{{ env.OIDC_CLIENT_SECRET }}"
          local redirect_uri = ngx.var.scheme .. "://" .. ngx.var.host .. "/npmplus-oidc-{{ id }}/callback"

          local args = ngx.req.get_uri_args()
          local code  = args.code
          local state = args.state

          if not code or not state then
            ngx.status = 400; ngx.say("Missing code or state"); return
          end

          -- Validate state
          local state_key  = "state:" .. state
          local state_json = ngx.shared.oidc_sessions:get(state_key)
          if not state_json then
            ngx.status = 403; ngx.say("Invalid or expired state"); return
          end
          ngx.shared.oidc_sessions:delete(state_key)
          local state_data = cjson.decode(state_json)
          local rd         = state_data.rd or "/"

          -- Get token endpoint from discovery cache
          local disc_doc
          local cached = ngx.shared.discovery:get(issuer)
          if cached then
            disc_doc = cjson.decode(cached)
          else
            local httpc = http.new()
            local res = httpc:request_uri(issuer .. "/.well-known/openid-configuration", { method = "GET", ssl_verify = true })
            disc_doc = cjson.decode(res.body)
            ngx.shared.discovery:set(issuer, res.body, 3600)
          end

          -- Exchange code for tokens
          local httpc = http.new()
          local res, err = httpc:request_uri(disc_doc.token_endpoint, {
            method  = "POST",
            ssl_verify = true,
            headers = { ["Content-Type"] = "application/x-www-form-urlencoded" },
            body    = "grant_type=authorization_code"
              .. "&code="          .. ngx.escape_uri(code)
              .. "&redirect_uri="  .. ngx.escape_uri(redirect_uri)
              .. "&client_id="     .. ngx.escape_uri(client_id)
              .. "&client_secret=" .. ngx.escape_uri(client_secret),
          })

          if not res or res.status ~= 200 then
            ngx.status = 502
            ngx.say("Token exchange failed: " .. (err or (res and res.status) or "unknown"))
            return
          end

          local tokens    = cjson.decode(res.body)
          local id_token  = tokens.id_token
          if not id_token then
            ngx.status = 502; ngx.say("No id_token in response"); return
          end

          -- Decode JWT payload (no sig verification — server-to-server token exchange is safe here)
          local parts = {}
          for part in id_token:gmatch("[^%.]+") do parts[#parts+1] = part end
          local payload_b64 = parts[2]
          -- Re-pad base64url
          payload_b64 = payload_b64:gsub("%-", "+"):gsub("_", "/")
          local pad = #payload_b64 % 4
          if pad == 2 then payload_b64 = payload_b64 .. "==" elseif pad == 3 then payload_b64 = payload_b64 .. "=" end
          local ok, claims = pcall(cjson.decode, ngx.decode_base64(payload_b64))
          if not ok then
            ngx.status = 502; ngx.say("Failed to decode id_token payload"); return
          end

          -- Validate nonce
          if claims.nonce ~= state_data.nonce then
            ngx.status = 403; ngx.say("Nonce mismatch"); return
          end

          -- Store session: random token → claims JSON, TTL = token exp or 8h
          local session_id  = ngx.encode_base64(ngx.hmac_sha1(client_secret, id_token .. tostring(ngx.now()))):gsub("[^%w]","")
          local ttl         = (claims.exp or (ngx.time() + 28800)) - ngx.time()
          if ttl < 0 then ttl = 28800 end
          ngx.shared.oidc_sessions:set(session_id, cjson.encode(claims), ttl)

          -- Set httpOnly session cookie
          local cookie_name = "npmplus_oidc_{{ id }}"
          ngx.header["Set-Cookie"] = cookie_name .. "=" .. session_id
            .. "; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=" .. ttl

          ngx.redirect(rd)
        }
      }
    {% endif %}

    # custom locations
    {{ locations }}

    {{ advanced_config }}

    # Custom
    include /data/custom_nginx/server_http.conf;
    include /data/custom_nginx/server_proxy.conf;
  }
{% endif %}
