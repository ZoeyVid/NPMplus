# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------
{% assign forward_host_last_char = forward_host | slice: -1 -%}

{% if enabled %}
  server {
    set $forward_scheme "{{ forward_scheme }}";
    set $server         "{{ forward_host }}";
    set $port           "{{ forward_port }}";
    set $forward_path   "{{ forward_path }}";

    {% if bandwidth_limit %}
    set $calculated_rate 0;
    limit_rate $calculated_rate;
    access_by_lua_block {
        local limit_str = "{{ bandwidth_limit }}"
        local limit = 0
        local multiplier = 1
        local last_char = string.sub(limit_str, -1)
        
        if last_char == "k" or last_char == "K" then
            multiplier = 1024
            limit = tonumber(string.sub(limit_str, 1, -2))
        elseif last_char == "m" or last_char == "M" then
            multiplier = 1024 * 1024
            limit = tonumber(string.sub(limit_str, 1, -2))
        else
            limit = tonumber(limit_str)
        end
        
        if limit then
            limit = limit * multiplier
            local ip = ngx.var.binary_remote_addr
            local dict = ngx.shared.ip_conns
            local new_count, err = dict:incr(ip, 1)
            if not new_count then
                 dict:set(ip, 1)
                 new_count = 1
            end
            
            local rate
            if new_count < 2 then
                rate = limit
            else
                rate = math.floor(limit / (new_count * 2))
            end
            ngx.var.calculated_rate = rate
        end
    }
    log_by_lua_block {
        local ip = ngx.var.binary_remote_addr
        local dict = ngx.shared.ip_conns
        dict:incr(ip, -1)
    }
    {% endif %}

    {% include "_common.conf" %}

    {% if access_list_id > 0 %}
      {% if access_list.items.length > 0 %}
        # Authorization
        auth_basic            "Authorization required";
        auth_basic_user_file  /data/access/{{ access_list_id }};
        {% if access_list.pass_auth %}
          proxy_set_header Authorization "";
        {% endif %}
      {% endif %}
      # Access Rules: {{ access_list.clients | size }} total
      {% for client in access_list.clients %}
        {{client | nginxAccessRule}}
      {% endfor %}
      deny all;
      # Access checks must...
      {% if access_list.satisfy_any %}
        satisfy any;
      {% else %}
        satisfy all;
      {% endif %}
    {% endif %}

    {% if block_exploits %}
      modsecurity on;
      {% if caching_enabled %}
        modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity-crs.conf;
      {% else %}
        modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity.conf;
      {% endif %}
    {% endif %}

    {% if use_default_location %}
      location / {
        {% if forward_scheme == "http" or forward_scheme == "https" %}
          include conf.d/include/proxy-headers.conf;
          proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
        {% elsif forward_scheme == "grpc" or forward_scheme == "grpcs" %}
          include conf.d/include/grpc-headers.conf;
          grpc_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
        {% elsif forward_scheme == "path" %}
          {% if forward_host_last_char == "/" %}
            alias {{ forward_host }};
          {% else %}
            root {{ forward_host }};
          {% endif %}
          {% if forward_path != null %}
            location ~* \.php(?:$|/) {
              fastcgi_split_path_info ^(.*\.php)(/.*)$;
              try_files $fastcgi_script_name =404;
              fastcgi_pass unix:/run/php{{ forward_port }}.sock;
            }
          {% endif %}
        {% endif %}
      }
    {% endif %}

    # custom locations
    {{ locations }}

    # Custom
    include /data/custom_nginx/server_proxy.conf;
  }
{% endif %}
