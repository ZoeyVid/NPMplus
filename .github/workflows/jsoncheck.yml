name: jsoncheck
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  jsoncheck:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          for file in $(find * -name "*.json"); do
            jq empty "$file" || { echo "::error file=$file::invalid JSON"; failed=1; }
          done
          exit ${failed:-0}
