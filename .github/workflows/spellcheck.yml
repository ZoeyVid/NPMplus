name: spellcheck
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: codespell-project/actions-codespell@v2.4.3
        with:
          check_filenames: true
          check_hidden: true
          skip: pnpm-lock.yaml,./frontend/translations
          ignore_words_list: afterAll,alog,clen,Nd,hasTable
