name: JSON check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: json-syntax-check
        uses: limitusus/json-syntax-check@v2
        with:
          pattern: "\\.json"
