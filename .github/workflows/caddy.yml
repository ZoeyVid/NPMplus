name: Build Caddy Docker Image
on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/caddy.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  pull_request:
    paths:
      - .github/workflows/caddy.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: docker.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: zoeyvid
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: caddy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
          tags: |
            zoeyvid/npmplus:caddy
            ghcr.io/zoeyvid/npmplus:caddy
