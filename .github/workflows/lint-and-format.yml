name: lint-and-format
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
jobs:
  lint-and-format:
    runs-on: ubuntu-slim
    env:
      BIOME: ${{ github.event_name == 'pull_request' && 'ci' || 'check --write' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
      - name: backend
        run: |
          set -x
          cd backend
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github | sed "s|,file=|,file=backend/|g" || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
      - name: frontend
        run: |
          set -x
          cd frontend
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github | sed "s|,file=|,file=frontend/|g" || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
          ./src/locale/scripts/locale-sort.sh
          pnpm formatjs compile-folder src/locale/src src/locale/lang
          pnpm tsc --noEmit
          pnpm vitest
      - name: nginxbeautifier
        run: |
          pnpm add -g nginxbeautifier
          nginxbeautifier -s 2 -r rootfs/usr/local/nginx/conf
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          signoff: true
          delete-branch: true
          commit-message: lint-and-format
          branch: lint-and-format
          title: lint-and-format
          body: lint-and-format
      - name: diff
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code
      - name: biome
        if: ${{ env.BIOME_FAILED == '1' }}
        run: exit 1
