name: lint-and-format
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  lint-and-format:
    runs-on: ubuntu-slim
    env:
      BIOME: ${{ github.event_name == 'pull_request' && 'ci' || 'check --write' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: latest
      - name: backend
        run: |
          set -x
          cd backend
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github | sed "s|,file=|,file=backend/|g" || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
          node validate-schema.js
      - name: frontend
        run: |
          set -x
          cd frontend
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github | sed "s|,file=|,file=frontend/|g" || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
          ./translations/sort-locale.sh
          pnpm vite build
      - name: nginxbeautifier
        run: |
          pnpm add -g nginxbeautifier
          nginxbeautifier -s 2 -r rootfs/usr/local/nginx/conf
      - uses: peter-evans/create-pull-request@v8.1.3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          signoff: true
          delete-branch: true
          commit-message: lint-and-format
          branch: lint-and-format
          title: lint-and-format
          body: lint-and-format
      - name: diff
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code
      - name: biome
        if: ${{ env.BIOME_FAILED == '1' }}
        run: exit 1
