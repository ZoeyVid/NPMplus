name: dependency-updates
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  aws-lc-update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: update aws-lc version
        id: update
        run: |
          AWSLC_VER="$(
          git ls-remote --tags --refs https://github.com/aws/aws-lc \
              | cut -d/ -f3 \
              | sed 's|rc|~&|I' \
              | sort -V \
              | sed 's|~||' \
              | tail -1
          )"
          AWSLC_SHA="$(git ls-remote https://github.com/aws/aws-lc "$AWSLC_VER" | cut -f1)"
          echo "compare=https://github.com/aws/aws-lc/compare/$(sed -n 's|^ARG AWSLC_VER=\(.*\) #.*|\1|p' Dockerfile)...$AWSLC_SHA" >> $GITHUB_OUTPUT
          sed -i "s|ARG AWSLC_VER=.*|ARG AWSLC_VER=$AWSLC_SHA # $AWSLC_VER|" Dockerfile
          echo "version=$AWSLC_VER" >> $GITHUB_OUTPUT
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          signoff: true
          delete-branch: true
          commit-message: update aws-lc version to ${{ steps.update.outputs.version }}
          branch: update-aws-lc-version
          title: update aws-lc version to ${{ steps.update.outputs.version }}
          body: ${{ steps.update.outputs.compare }}

  nginx-update:
    runs-on: ubuntu-slim
