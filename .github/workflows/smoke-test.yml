name: smoke-test
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - develop
    paths:
      - setup-npmplus.sh
      - crowdsec-doctor.sh
      - npmplus-boot-trace.sh
      - .github/workflows/smoke-test.yml
  pull_request:
    paths:
      - setup-npmplus.sh
      - crowdsec-doctor.sh
      - npmplus-boot-trace.sh
      - .github/workflows/smoke-test.yml

permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # recommended security defaults: crowdsec + appsec + firewall bouncer
          # + anubis with API-safe catch-all off + cloudflare trust (UFW is disabled below)
          - name: defaults
          # explicit admin credentials with firewall bouncer + challenge-all off,
          # caddy on, cloudflare trust off, private-LAN admin, and unattended upgrades
          - name: alternate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: preserve an unrelated Docker drop-in for the uninstall test
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nTimeoutStartSec=0\n' | sudo tee /etc/systemd/system/docker.service.d/99-operator-owned.conf >/dev/null
      # the answers are piped to every prompt, so the full interactive path runs
      # on a clean disposable vm: compose generation, ufw, crowdsec with bouncer
      # registration, anubis policy fetch, all crons installed
      - name: run setup-npmplus.sh end to end (${{ matrix.name }})
        env:
          TEST_ADMIN_PASSWORD: 'Smoke${NOT_SET}-Password-1'
        run: |
          if [[ "${{ matrix.name }}" == "alternate" ]]; then
            # Exercise LAN-only admin mode without changing the hosted runner's
            # real firewall. The real systemd socket relay is still installed,
            # started, reached over the runner's private IP, and uninstalled.
            sudo tee /usr/local/bin/ufw >/dev/null <<'UFW'
          #!/bin/bash
          printf '%s\n' "$*" >>/tmp/npmplus-smoke-ufw.log
          [[ "$*" == "status" ]] && printf '%s\n' 'Status: active'
          exit 0
          UFW
            sudo chmod 0755 /usr/local/bin/ufw
          fi
          if [[ "${{ matrix.name }}" == "defaults" ]]; then
            # Keep every default except UFW: enabling it severs the hosted
            # runner's control connection before the remaining checks run.
            # Include Caddy so the update regression proves that two tags from
            # ghcr.io/mangyan1/npmplus retain their distinct service images.
            answers=(
              '' # timezone
              '' # initial admin email
              '' # initial admin password
              '' # crowdsec
              '' # appsec
              '' # firewall bouncer
              '' # strict boot protection
              '' # anubis
              '' # challenge all
              y  # caddy
              '' # cloudflare
              n  # optional Cloudflare-only origin lock
              n  # host networking
              n  # ufw
              '' # unattended upgrades
            )
          else
            answers=(
              UTC
              admin@example.com
              "$TEST_ADMIN_PASSWORD"
              y # crowdsec
              y # appsec
              n # firewall bouncer
              y # anubis
              n # challenge all
              y # caddy
              n # cloudflare
              n # host networking
              y # configure ufw (stubbed above)
              y # allow admin UI from the private LAN
              y # unattended upgrades
              '' # detected SSH port
              n # do not restrict SSH in this disposable test
            )
          fi
          printf '%s\n' "${answers[@]}" | sudo bash setup-npmplus.sh
      - name: verify the stack
        # sudo: generated deployment configuration remains root-owned
        run: |
          for c in $(sudo docker compose -f /opt/npmplus/compose.yaml ps -a --format '{{.Name}}'); do
            echo "--- $c logs:"; sudo docker logs --tail 40 "$c" 2>&1 || true
          done
          stopped="$(sudo docker compose -f /opt/npmplus/compose.yaml ps -a --format '{{.State}}' | grep -vx running || true)"
          if [[ -n "$stopped" ]]; then
            echo "containers not running:" >&2
            sudo docker compose -f /opt/npmplus/compose.yaml ps -a
            exit 1
          fi
          # npmplus spends its first minute on apk add php-fpm before nginx binds 443
          code="000"
          for _ in $(seq 1 40); do
            code="$(curl -ksS -o /dev/null -w '%{http_code}' -m 10 https://127.0.0.1/ || true)"
            [[ "$code" != "000" ]] && break
            sleep 5
          done
          if [[ "$code" == "000" ]]; then
            echo "no https response from npmplus (code $code)" >&2
            exit 1
          fi
          echo "smoke test ok - all containers up, https answers with $code"
          crowdsec_package_status="$(dpkg-query -W -f='${Status}' crowdsec 2>/dev/null || true)"
          if [[ "$crowdsec_package_status" == "install ok installed" ]]; then
            echo "conflicting native CrowdSec package is still installed" >&2
            exit 1
          fi
          sudo docker compose -f /opt/npmplus/compose.yaml config --images | grep -q '@sha256:'
          sudo test -f /opt/anubis-data/anubis/honeypot.addrs
          sudo grep -Fq '/opt/anubis-data/anubis:/run/npmplus-anubis:ro' /opt/npmplus/compose.yaml
          sudo grep -Fq 'ANUBIS_HONEYPOT_LOG_FILE=/run/npmplus-anubis/honeypot.addrs' /opt/npmplus/compose.yaml
          sudo docker exec npmplus test -f /run/npmplus-anubis/honeypot.addrs
          if sudo grep -q 'name: everything-else' /opt/anubis.yaml; then
            echo "Anubis challenge-all unexpectedly enabled despite the safe default/explicit no" >&2
            exit 1
          fi
          if [[ "${{ matrix.name }}" == "alternate" ]]; then
            sudo grep -Fq '127.0.0.1:81:81/tcp' /opt/npmplus/compose.yaml
            sudo systemctl is-active --quiet npmplus-admin-lan.socket
            sudo grep -qx 'Wants=network-online.target' /etc/systemd/system/npmplus-admin-lan.socket
            sudo grep -qx 'After=network-online.target' /etc/systemd/system/npmplus-admin-lan.socket
            sudo grep -qx 'FreeBind=true' /etc/systemd/system/npmplus-admin-lan.socket
            lan_ip="$(ip -o -4 route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "src") { print $(i + 1); exit } }')"
            test -n "$lan_ip"
            curl -ksSf --max-time 10 "https://$lan_ip:81/api" >/dev/null
            sudo grep -Eq "allow from .+ to $lan_ip port 81 proto tcp comment npmplus-admin-lan" /tmp/npmplus-smoke-ufw.log
          fi
          if [[ "${{ matrix.name }}" == "defaults" ]]; then
            sudo grep -qx 'log_mode: file' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
            sudo grep -qx 'daemonize: true' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
            sudo grep -qx 'mode: iptables' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
            sudo test ! -e /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
            sudo grep -A2 '^iptables_chains:$' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml | grep -qx '  - FORWARD'
            sudo crowdsec-firewall-bouncer \
              -c /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml -t
            sudo test -x /usr/local/sbin/npmplus-wait-for-crowdsec-lapi
            sudo grep -qx 'ExecStartPre=/usr/local/sbin/npmplus-wait-for-crowdsec-lapi' \
              /etc/systemd/system/crowdsec-firewall-bouncer.service.d/10-npmplus-container-lapi.conf
            sudo systemctl is-active --quiet crowdsec-firewall-bouncer
            sudo systemctl is-enabled --quiet npmplus-public.service
            sudo systemctl is-active --quiet npmplus-public.service
            sudo systemctl is-enabled --quiet npmplus-boot-guard.service
            sudo systemctl is-active --quiet npmplus-boot-guard.service
            sudo test -x /usr/local/sbin/npmplus-boot-guard
            if sudo /usr/local/sbin/npmplus-boot-guard status >/dev/null 2>&1; then
              echo "boot guard remained after healthy startup" >&2
              exit 1
            fi
            sudo grep -qx 'PartOf=docker.service' \
              /etc/systemd/system/crowdsec-firewall-bouncer.service.d/10-npmplus-container-lapi.conf
            for container in npmplus npmplus-anubis npmplus-caddy; do
              test "$(sudo docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container")" = on-failure
            done
            rules="$(sudo iptables-save)"
            grep -Eq '^-A INPUT .*--match-set crowdsec-blacklists src.* -j (DROP|REJECT)$' <<<"$rules"
            grep -Eq '^-A FORWARD .*--match-set crowdsec-blacklists src.* -j (DROP|REJECT)$' <<<"$rules"
          fi
          if sudo docker logs npmplus-anubis 2>&1 | grep -q "can't init honeypot subsystem"; then
            echo "Anubis failed to initialize its honeypot" >&2
            exit 1
          fi
          sudo test -x /usr/local/sbin/npmplus-wait-for-dns
          sudo grep -q '^ExecStartPre=/usr/local/sbin/npmplus-wait-for-dns$' \
            /etc/systemd/system/docker.service.d/10-wait-for-dns.conf
          resolver_test="$(mktemp)"
          (sleep 2; printf 'nameserver 192.0.2.53\n' >"$resolver_test") &
          start="$(date +%s)"
          sudo env NPMPLUS_RESOLV_CONF="$resolver_test" /usr/local/sbin/npmplus-wait-for-dns
          test "$(( $(date +%s) - start ))" -ge 2
          rm -f "$resolver_test"
      - name: unified maintenance menu is available
        run: |
          sudo /opt/npmplus/setup-npmplus.sh --help | grep -q -- '--doctor'
          sudo /opt/npmplus/setup-npmplus.sh --help | grep -q -- '--boot-trace'
          sudo /opt/npmplus/setup-npmplus.sh --help | grep -q -- '--restore'
          menu_output="$(printf '7\n' | script --quiet --return \
            --command 'sudo /opt/npmplus/setup-npmplus.sh' /dev/null)"
          grep -q 'Safe update (recommended)' <<<"$menu_output"
          grep -q 'Check or repair CrowdSec' <<<"$menu_output"
          grep -q 'Create a startup/reboot diagnostic report' <<<"$menu_output"
          grep -q 'Restore a backup' <<<"$menu_output"
      # only the alternate variant sets INITIAL_ADMIN_EMAIL/PASSWORD; a working
      # login proves the env block was generated into the compose file correctly
      - name: admin login works (alternate)
        if: matrix.name == 'alternate'
        env:
          TEST_ADMIN_PASSWORD: 'Smoke${NOT_SET}-Password-1'
        run: |
          code="000"
          for _ in $(seq 1 40); do
            code="$(curl -ksS -o /tmp/login.json -w '%{http_code}' -m 10 -H 'Content-Type: application/json' \
              -d "{\"identity\":\"admin@example.com\",\"secret\":\"$TEST_ADMIN_PASSWORD\"}" https://127.0.0.1:81/api/tokens || true)"
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          if [[ "$code" != "200" ]]; then
            echo "admin login failed (code $code):" >&2
            cat /tmp/login.json 2>/dev/null >&2
            exit 1
          fi
          echo "admin login ok"
          if sudo grep -qE 'INITIAL_ADMIN_(EMAIL|PASSWORD|PASSWORD_FILE)' /opt/npmplus/compose.yaml; then
            echo "bootstrap administrator values remain in compose.yaml" >&2
            exit 1
          fi
          sudo test ! -e /run/npmplus-initial-admin-password
          if sudo docker inspect npmplus --format '{{range .Mounts}}{{println .Source}}{{end}}' |
            grep -Fxq /run/npmplus-initial-admin-password; then
            echo "npmplus retains the deleted bootstrap-secret bind mount" >&2
            exit 1
          fi
          if sudo docker inspect npmplus --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -F "$TEST_ADMIN_PASSWORD"; then
            echo "bootstrap administrator password remains in the container environment" >&2
            exit 1
          fi
      - name: installed stack survives a Docker daemon restart
        run: |
          sudo test ! -e /run/npmplus-initial-admin-password
          if sudo docker inspect npmplus --format '{{range .Mounts}}{{println .Source}}{{end}}' |
            grep -Fxq /run/npmplus-initial-admin-password; then
            echo "reboot regression: npmplus still depends on the deleted /run bootstrap secret" >&2
            exit 1
          fi

          # GitHub-hosted runners cannot reboot themselves without terminating
          # the job. Restarting Docker exercises the persistent container objects
          # and restart policies that caused the real VM boot failure.
          sudo systemctl restart docker.service
          stack_ready=false
          for _ in $(seq 1 120); do
            stack_ready=true
            while read -r service; do
              cid="$(sudo docker compose -f /opt/npmplus/compose.yaml ps -a -q "$service" 2>/dev/null || true)"
              if [[ -z "$cid" ]] || [[ "$(sudo docker inspect --format '{{.State.Status}}' "$cid")" != running ]]; then
                stack_ready=false
                break
              fi
              health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"
              if [[ "$health" != none && "$health" != healthy ]]; then
                stack_ready=false
                break
              fi
            done < <(sudo docker compose -f /opt/npmplus/compose.yaml config --services)
            if [[ "$stack_ready" == true ]] && \
              curl -fkSs --connect-timeout 2 --max-time 5 -o /dev/null https://127.0.0.1/ && \
              curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api |
                grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              break
            fi
            stack_ready=false
            sleep 2
          done
          if [[ "$stack_ready" != true ]]; then
            sudo docker compose -f /opt/npmplus/compose.yaml ps -a
            sudo docker compose -f /opt/npmplus/compose.yaml logs --no-color --tail 100
            exit 1
          fi
          if [[ "${{ matrix.name }}" == "defaults" ]]; then
            sudo systemctl restart crowdsec-firewall-bouncer
            sudo systemctl is-active --quiet crowdsec-firewall-bouncer
          fi
      - name: safe update snapshots state and passes strict health checks
        if: matrix.name == 'defaults'
        run: |
          # Reproduce the legacy VM state: a version-3 wrapper plus a setup
          # copy installed without its execute bit, plus the root-owned Anubis
          # data directory produced by v1.6. Also reproduce the real reboot
          # failure: Docker preserved an empty resolver file in the existing
          # host-networked container. The downloaded current script must repair
          # all three before entering the transactional update.
          sudo sed -i 's/NPMPLUS_SAFE_UPDATE_WRAPPER_VERSION=5/NPMPLUS_SAFE_UPDATE_WRAPPER_VERSION=3/' /usr/local/bin/npmplus-safe-update
          sudo chmod 0644 /opt/npmplus/setup-npmplus.sh
          for _ in $(seq 1 30); do
            health="$(sudo docker inspect --format '{{.State.Health.Status}}' npmplus)"
            [[ "$health" == 'healthy' ]] && break
            sleep 2
          done
          test "$health" = 'healthy'
          api_ready=false
          for _ in $(seq 1 30); do
            if curl -fkSs --connect-timeout 2 --max-time 5 -o /dev/null https://127.0.0.1/ && \
              curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api | grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              api_ready=true
              break
            fi
            sleep 2
          done
          test "$api_ready" = true
          # Reproduce the affected RC layout: the honeypot source and nested
          # destination were both auto-created as directories. The update must
          # repair the file, migrate the mount, and recreate npmplus before its
          # transactional preflight checks the baseline.
          sudo docker stop npmplus-anubis
          sudo rm -f /opt/anubis-data/anubis/honeypot.addrs
          sudo mkdir /opt/anubis-data/anubis/honeypot.addrs
          sudo mkdir -p /opt/npmplus/anubis/honeypot.addrs
          sudo sed -i \
            's|/opt/anubis-data/anubis:/run/npmplus-anubis:ro|/opt/anubis-data/anubis/honeypot.addrs:/data/anubis/honeypot.addrs:ro|' \
            /opt/npmplus/compose.yaml
          sudo sed -i '/ANUBIS_HONEYPOT_LOG_FILE=/d' /opt/npmplus/compose.yaml
          sudo chown -R 0:0 /opt/anubis-data
          sudo docker start npmplus-anubis
          sudo docker exec npmplus sh -c ': > /etc/resolv.conf'
          # Reproduce an existing install that opted out of AppSec. The explicit
          # update flag must survive delegation through the safe-update wrapper.
          # Also reproduce the deprecated singular acquisition key from v1.19.
          sudo sed -i 's|^APPSEC_URL=.*|APPSEC_URL=|' /opt/npmplus/crowdsec/crowdsec.conf
          sudo sed -i '/^appsec_configs:$/ { N; s|^appsec_configs:\n  - |appsec_config: |; }' /opt/crowdsec/conf/acquis.d/npmplus.yaml
          # Reproduce RC3's firewall-bouncer config and boot unit: its missing
          # log_mode failed validation, and it had no LAPI readiness ordering.
          sudo sed -i '/^pid_dir:/d;/^daemonize:/d;/^log_mode:/d;/^log_dir:/d;/^log_level:/d;/^log_compression:/d;/^log_max_size:/d;/^log_max_backups:/d;/^log_max_age:/d' \
            /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
          sudo rm -f /usr/local/sbin/npmplus-wait-for-crowdsec-lapi \
            /etc/systemd/system/crowdsec-firewall-bouncer.service.d/10-npmplus-container-lapi.conf
          # RC retries could leave our generated package configuration without
          # its ownership marker. Safe update must recognize and adopt it before
          # checking or repairing protected startup.
          sudo rm -f /var/lib/npmplus/installed-firewall-bouncer
          sudo systemctl daemon-reload
          sudo systemctl stop crowdsec-firewall-bouncer
          if sudo docker exec npmplus awk '$1 == "nameserver" && $2 != "" { found=1; exit } END { exit !found }' /etc/resolv.conf; then
            echo "resolver failure fixture is not empty" >&2
            exit 1
          fi
          update_log="$(mktemp)"
          sudo bash setup-npmplus.sh --update --enable-appsec \
            --enable-cloudflare-origin-lock 2>&1 | tee "$update_log"
          grep -q 'update healthy - last good snapshot kept' "$update_log"
          grep -q 'adopting legacy installer-managed firewall bouncer' "$update_log"
          rm -f "$update_log"
          sudo test -x /opt/npmplus/setup-npmplus.sh
          sudo grep -qx '# NPMPLUS_SAFE_UPDATE_WRAPPER_VERSION=5' /usr/local/bin/npmplus-safe-update
          sudo test -f /var/backups/npmplus-last-good/override.yaml
          test "$(stat -c '%u:%g' /opt/anubis-data)" = '1000:1000'
          sudo test -f /opt/anubis-data/anubis/honeypot.addrs
          sudo grep -Fq '/opt/anubis-data/anubis:/run/npmplus-anubis:ro' /opt/npmplus/compose.yaml
          sudo grep -Fq 'ANUBIS_HONEYPOT_LOG_FILE=/run/npmplus-anubis/honeypot.addrs' /opt/npmplus/compose.yaml
          sudo docker exec npmplus test -f /run/npmplus-anubis/honeypot.addrs
          sudo docker exec npmplus awk '$1 == "nameserver" && $2 != "" { found=1; exit } END { exit !found }' /etc/resolv.conf
          test "$(sudo docker inspect --format '{{.Image}}' npmplus)" != \
            "$(sudo docker inspect --format '{{.Image}}' npmplus-caddy)"
          sudo grep -q '^APPSEC_URL=http://crowdsec:7422$' /opt/npmplus/crowdsec/crowdsec.conf
          sudo grep -q '^source: appsec$' /opt/crowdsec/conf/acquis.d/npmplus.yaml
          sudo grep -q '^appsec_configs:$' /opt/crowdsec/conf/acquis.d/npmplus.yaml
          if sudo grep -q '^appsec_config:' /opt/crowdsec/conf/acquis.d/npmplus.yaml; then
            echo "deprecated singular AppSec acquisition key was generated" >&2
            exit 1
          fi
          sudo grep -qx 'log_mode: file' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
          sudo grep -qx 'daemonize: true' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
          sudo grep -qx 'mode: iptables' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
          sudo test ! -e /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
          sudo grep -A2 '^iptables_chains:$' /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml | grep -qx '  - FORWARD'
          sudo crowdsec-firewall-bouncer \
            -c /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml -t
          sudo test -x /usr/local/sbin/npmplus-wait-for-crowdsec-lapi
          sudo systemctl is-active --quiet crowdsec-firewall-bouncer
          sudo test -f /var/lib/npmplus/installed-firewall-bouncer
          sudo systemctl is-active --quiet npmplus-public.service
          sudo systemctl is-active --quiet npmplus-cloudflare-origin-lock.service
          sudo /usr/local/sbin/npmplus-cloudflare-origin-lock status
          sudo test -s /var/lib/npmplus/cloudflare-ips-v4
          sudo test -s /var/lib/npmplus/cloudflare-ips-v6

      - name: backup restore round trip works (migration path)
        if: matrix.name == 'defaults'
        run: |
          # prove the migration story against the freshly-updated healthy stack:
          # take a backup with the real helper, then restore it and confirm the
          # database, certificates, and crowdsec state survive
          set -x
          test -x /usr/local/bin/npmplus-backup || { echo "backup helper missing"; exit 1; }
          sudo /usr/local/bin/npmplus-backup
          sudo tail -n 20 /var/log/npmplus-backup.log
          backup_file="$(sudo bash -c 'ls -1t /var/backups/npmplus/npmplus-*.tar.gz | head -1')"
          # the backup dir is root-only (0700) and the tars are 0600: check as root
          sudo test -s "$backup_file" || { echo "no backup archive produced"; sudo ls -la /var/backups/npmplus; exit 1; }
          before_hosts="$(sudo docker exec npmplus node -e "const d=require('better-sqlite3')('/data/npmplus/database.sqlite',{readonly:true});console.log(d.prepare('select count(*) c from proxy_host').get().c);d.close()")" \
            || { echo "cannot read the proxy host count before the restore"; exit 1; }
          test -s /opt/npmplus/compose.yaml
          compose_before="$(sudo sha256sum /opt/npmplus/compose.yaml | awk '{print $1}')"

          printf 'restore\n' | sudo /opt/npmplus/setup-npmplus.sh --restore "$backup_file" >/tmp/npmplus-restore.log 2>&1
          restore_status="${PIPESTATUS[1]}"
          cat /tmp/npmplus-restore.log
          test "$restore_status" -eq 0 || { echo "restore exited $restore_status"; exit 1; }
          grep -q 'restore complete' /tmp/npmplus-restore.log

          # the machine's compose configuration must be untouched by a restore
          test "$(sudo sha256sum /opt/npmplus/compose.yaml | awk '{print $1}')" = "$compose_before"

          # the restored database still contains the same proxy hosts
          after_hosts="$(sudo docker exec npmplus node -e "const d=require('better-sqlite3')('/data/npmplus/database.sqlite',{readonly:true});console.log(d.prepare('select count(*) c from proxy_host').get().c);d.close()")" \
            || { echo "cannot read the proxy host count after the restore"; exit 1; }
          test "$before_hosts" = "$after_hosts"

          # the API answers and the stack is healthy
          ready=false
          for _ in $(seq 1 120); do
            if curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api |
              grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          # a restore must refuse to run without a confirmation word
          set +e
          refuse_output="$(printf '\n' | sudo /opt/npmplus/setup-npmplus.sh --restore "$backup_file" 2>&1)"
          refuse_status="$?"
          set -e
          test "$refuse_status" -ne 0
          grep -q 'aborted' <<<"$refuse_output"
      - name: strict boot fails closed while the firewall bouncer is unavailable
        if: matrix.name == 'defaults'
        run: |
          sudo systemctl stop npmplus-public.service
          sudo docker compose -f /opt/npmplus/compose.yaml stop npmplus anubis npmplus-caddy
          sudo systemctl stop crowdsec-firewall-bouncer.service
          sudo systemctl mask crowdsec-firewall-bouncer.service

          sudo systemctl restart docker.service
          sleep 5
          sudo /usr/local/sbin/npmplus-boot-guard status
          if sudo systemctl is-active --quiet npmplus-public.service; then
            echo "protected public service unexpectedly succeeded without its firewall bouncer" >&2
            exit 1
          fi

          sudo ip netns add npmplus-attacker
          sudo ip link add npmplus-host type veth peer name npmplus-peer
          sudo ip link set npmplus-peer netns npmplus-attacker
          sudo ip address add 198.51.100.1/30 dev npmplus-host
          sudo ip link set npmplus-host up
          sudo ip netns exec npmplus-attacker ip address add 198.51.100.2/30 dev npmplus-peer
          sudo ip netns exec npmplus-attacker ip link set lo up
          sudo ip netns exec npmplus-attacker ip link set npmplus-peer up
          # Simulate a scripted attacker repeatedly probing during the failed
          # security startup from a non-private source. Even if Docker revives a
          # container, the pre-routing boot guard must prevent every response.
          for _ in $(seq 1 20); do
            code="$(sudo ip netns exec npmplus-attacker curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 1 --max-time 1 http://198.51.100.1/ || true)"
            test "$code" = 000
          done

          sudo systemctl unmask crowdsec-firewall-bouncer.service
          sudo systemctl start npmplus-public.service
          sudo systemctl is-active --quiet crowdsec-firewall-bouncer.service
          sudo systemctl is-active --quiet npmplus-public.service
          if sudo /usr/local/sbin/npmplus-boot-guard status >/dev/null 2>&1; then
            echo "boot guard remained after protected startup succeeded" >&2
            exit 1
          fi
          sudo ip netns delete npmplus-attacker
          sudo ip link delete npmplus-host 2>/dev/null || true
          ready=false
          for _ in $(seq 1 120); do
            if curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api |
              grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: failed update restores the complete last-good state
        if: matrix.name == 'defaults'
        run: |
          compose_before="$(sudo sha256sum /opt/npmplus/compose.yaml | awk '{print $1}')"
          setup_before="$(sudo sha256sum /opt/npmplus/setup-npmplus.sh | awk '{print $1}')"
          sudo tee /tmp/npmplus-failing-update >/dev/null <<'FAIL_UPDATE'
          #!/bin/bash
          set -eu
          printf '\n# rollback-fixture\n' >>/opt/npmplus/compose.yaml
          docker stop npmplus >/dev/null
          printf 'intentionally-corrupt-database' >/opt/npmplus/npmplus/database.sqlite
          exit 42
          FAIL_UPDATE
          sudo chmod 0700 /tmp/npmplus-failing-update

          set +e
          sudo env NPMPLUS_SETUP_CANDIDATE=/tmp/npmplus-failing-update \
            /usr/local/bin/npmplus-safe-update 2>&1 | tee /tmp/npmplus-failed-update.log
          update_status="${PIPESTATUS[0]}"
          set -e
          test "$update_status" -ne 0
          grep -q 'health check FAILED - reverting to the last good state' /tmp/npmplus-failed-update.log
          grep -q 'reverted - failure diagnostics are in' /tmp/npmplus-failed-update.log
          test "$(sudo sha256sum /opt/npmplus/compose.yaml | awk '{print $1}')" = "$compose_before"
          test "$(sudo sha256sum /opt/npmplus/setup-npmplus.sh | awk '{print $1}')" = "$setup_before"
          if sudo grep -q rollback-fixture /opt/npmplus/compose.yaml; then
            echo "failed update content remained after rollback" >&2
            exit 1
          fi

          recovered=false
          for _ in $(seq 1 120); do
            health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' npmplus 2>/dev/null || true)"
            if [[ "$health" == healthy ]] && \
              curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api |
                grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              recovered=true
              break
            fi
            sleep 2
          done
          test "$recovered" = true
          test "$(sudo docker exec npmplus node -e "const d=require('better-sqlite3')('/data/npmplus/database.sqlite',{readonly:true});console.log(d.pragma('integrity_check',{simple:true}));d.close()")" = ok
          sudo systemctl is-active --quiet npmplus-public.service
          sudo systemctl is-active --quiet npmplus-cloudflare-origin-lock.service
          sudo /usr/local/sbin/npmplus-cloudflare-origin-lock status
          sudo test -s /var/backups/npmplus-last-good/failed-ps.txt
          sudo test -s /var/backups/npmplus-last-good/failed-logs.txt
      - name: uninstall removes protected-start and origin-lock state
        if: matrix.name == 'defaults'
        run: |
          printf 'uninstall\n' | sudo /opt/npmplus/setup-npmplus.sh --uninstall --no-backup
          test ! -e /etc/systemd/system/npmplus-public.service
          test ! -e /etc/systemd/system/npmplus-cloudflare-origin-lock.service
          test ! -e /usr/local/sbin/npmplus-start-protected
          test ! -e /usr/local/sbin/npmplus-boot-guard
          test ! -e /usr/local/sbin/npmplus-cloudflare-origin-lock
          test ! -e /var/lib/npmplus/strict-boot-protection
          test ! -e /var/lib/npmplus/cloudflare-origin-lock
          if sudo iptables-save -t raw | grep -q NPMPLUS-CF; then
            echo "Cloudflare origin-lock rules survived uninstall" >&2
            exit 1
          fi
          if sudo iptables-save -t raw | grep -q NPMPLUS-BOOT; then
            echo "protected-start boot-guard rules survived uninstall" >&2
            exit 1
          fi
          if sudo ipset list npcf4 >/dev/null 2>&1; then
            echo "Cloudflare origin-lock ipset survived uninstall" >&2
            exit 1
          fi
      - name: uninstall, reinstall, and restart without losing operator Docker settings
        if: matrix.name == 'alternate'
        run: |
          printf 'uninstall\n' | sudo /opt/npmplus/setup-npmplus.sh --uninstall
          test ! -e /opt/npmplus
          test -f /etc/systemd/system/docker.service.d/99-operator-owned.conf
          test ! -e /etc/systemd/system/npmplus-admin-lan.socket
          test ! -e /etc/systemd/system/npmplus-admin-lan.service

          answers=(
            '' # timezone
            '' # setup wizard
            '' # setup wizard password
            '' # crowdsec
            '' # appsec
            n  # firewall bouncer (already covered by the first installation)
            '' # anubis
            '' # challenge all (safe default off)
            y  # caddy
            '' # cloudflare
            n  # host networking
            n  # ufw
            n  # unattended upgrades
          )
          printf '%s\n' "${answers[@]}" | sudo bash setup-npmplus.sh
          sudo systemctl restart docker.service
          ready=false
          for _ in $(seq 1 120); do
            if [[ "$(sudo docker inspect --format '{{.State.Health.Status}}' npmplus 2>/dev/null || true)" == healthy ]] && \
              curl -fkSs --connect-timeout 2 --max-time 5 https://127.0.0.1:81/api |
                grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test -f /etc/systemd/system/docker.service.d/99-operator-owned.conf

  # The restore action must work on both supported distro families, whichever
  # combination of old/new server is used for a migration. The restore path is
  # deliberately distro-agnostic (no apt/dpkg/systemd/UFW calls), so it is proven
  # inside a stock Debian container with the runner's Docker socket mounted:
  # drive a real --restore against a genuine backup archive on Debian.
  restore-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:13
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prepare debian environment
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq bash curl tar findutils bsdmainutils docker.io docker-compose >/dev/null
          test -s /etc/os-release
          . /etc/os-release
          echo "running on: $ID $VERSION_CODENAME"
          [[ "$ID" == "debian" ]] || { echo "expected debian" >&2; exit 1; }
          docker version --format '{{.Client.Version}}' >/dev/null
          docker compose version
      - name: restore validates archives and refuses invalid ones
        shell: bash
        run: |
          # note: the refusal checks run the restore expecting a non-zero
          # exit, and the step shell is bash -e -o pipefail, so the expected
          # failure must not fail the pipeline - capture instead of piping
          check_refusal() { # check_refusal "archive" "expected message"
            local output
            if output="$(bash setup-npmplus.sh --restore "$1" 2>&1)"; then
              echo "restore unexpectedly accepted: $1" >&2
              exit 1
            fi
            grep -q "$2" <<<"$output" || { echo "missing '$2' in: $output" >&2; exit 1; }
            echo "PASS: $2"
          }

          # a tar that is not a npmplus backup must be rejected
          mkdir -p /tmp/fake/opt/npmplus
          echo not-a-database >/tmp/fake/opt/npmplus/nope
          tar -czf /tmp/not-a-backup.tar.gz -C /tmp/fake opt/npmplus
          check_refusal /tmp/not-a-backup.tar.gz 'backup contains no database'

          # a valid backup but no installation on this machine must be refused
          mkdir -p /tmp/good/opt/npmplus/npmplus
          printf 'sqlite-test-bytes' >/tmp/good/opt/npmplus/npmplus/database.sqlite
          tar -czf /tmp/npmplus-valid.tar.gz -C /tmp/good opt/npmplus
          check_refusal /tmp/npmplus-valid.tar.gz 'no installation found'

          # the usage/help surfaces the restore action
          bash setup-npmplus.sh --help | grep -q -- '--restore'
      - name: full restore round trip on debian (real stack)
        shell: bash
        run: |
          fail=0
          check() {
            local name="$1"
            shift
            if "$@"; then echo "PASS: $name"; else echo "FAIL: $name"; fail=1; fi
          }

          # Build a real (small) npmplus-style installation: compose file with
          # one npmplus service plus the data layout --restore expects, a
          # database, and a backup archive in the same layout the daily
          # backup helper produces. Then restore it on Debian.
          mkdir -p /opt/npmplus/npmplus /opt/npmplus/nginx/logs /opt/npmplus/tls
          cat >/opt/npmplus/compose.yaml <<'YAML'
          name: npmplus
          services:
            npmplus:
              container_name: npmplus
              image: busybox
              command: sh -c 'mkdir -p /data/npmplus && sleep infinity'
              restart: no
          YAML
          printf 'debian-restore-test-database' >/opt/npmplus/npmplus/database.sqlite
          printf 'old-cert' >/opt/npmplus/tls/cert.pem
          docker compose -f /opt/npmplus/compose.yaml up -d >/dev/null
          check "fake stack running" bash -c 'docker inspect --format "{{.State.Status}}" npmplus | grep -qx running'

          # the archive: a backup of a DIFFERENT machine's data (migration)
          mkdir -p /tmp/oldserver/opt/npmplus/npmplus /tmp/oldserver/opt/npmplus/tls /tmp/oldserver/opt/crowdsec/conf
          printf 'migrated-database-with-all-hosts' >/tmp/oldserver/opt/npmplus/npmplus/database.sqlite
          printf 'new-cert-from-old-machine' >/tmp/oldserver/opt/npmplus/tls/cert.pem
          printf 'crowdsec-state' >/tmp/oldserver/opt/crowdsec/conf/config.yaml
          tar -czf /tmp/oldmachine-backup.tar.gz -C /tmp/oldserver opt/npmplus opt/crowdsec

          printf 'restore\n' | bash setup-npmplus.sh --restore /tmp/oldmachine-backup.tar.gz >/tmp/debian-restore.log 2>&1
          restore_status="${PIPESTATUS[1]}"
          check "restore exited 0" test "$restore_status" -eq 0
          check "log says restore complete" grep -q 'restore complete' /tmp/debian-restore.log

          # the restored data must be the OLD machine's data
          check "database is the migrated one" grep -q 'migrated-database-with-all-hosts' /opt/npmplus/npmplus/database.sqlite
          check "cert is the migrated one" grep -q 'new-cert-from-old-machine' /opt/npmplus/tls/cert.pem

          # the machine's own compose file is kept, not replaced
          check "compose kept (this machine's)" grep -q 'container_name: npmplus' /opt/npmplus/compose.yaml
          if grep -q 'oldserver' /opt/npmplus/compose.yaml; then
            echo "FAIL: compose was replaced"
            fail=1
          else
            echo "PASS: compose not replaced"
          fi

          # crowdsec state lands only when this install runs it: with no
          # crowdsec service in compose, the restore must say so and skip
          check "crowdsec skip note" grep -q 'does not run it - skipped' /tmp/debian-restore.log

          # a snapshot of the replaced state was kept
          check "pre-restore snapshot kept" bash -c 'ls -d /var/backups/npmplus/pre-restore-* >/dev/null'
          if ls -d /var/backups/npmplus/pre-restore-*/ >/dev/null 2>&1; then
            check "snapshot has the replaced database" grep -q 'debian-restore-test-database' /var/backups/npmplus/pre-restore-*/database.sqlite
          fi

          test "$fail" -eq 0
